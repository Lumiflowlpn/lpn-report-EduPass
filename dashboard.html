<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard สรุปผล Edu Pass</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .logout-btn { background-color: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .filter-section { background: #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap:10px;}
        select { padding: 8px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #34495e; color: white; text-align: center; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        .summary-box { background: #007bff; color: white; padding: 20px; border-radius: 8px; text-align: center; font-size: 20px; margin-bottom: 20px; line-height: 1.6;}
        .highlight { font-size: 26px; font-weight: bold; color: #ffeb3b; }
        
        /* กล่องตั้งค่าเป้าหมาย */
        #targetSetupBox { display: none; background: #fff3cd; border: 1px solid #ffeeba; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .setup-header { margin-bottom: 15px; font-size: 16px; color: #856404; }
        .target-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 15px;}
        .target-item input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .btn-setup { background: #17a2b8; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;}
        .btn-save { background: #28a745; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 20px; width: 100%; font-size: 16px;}
        .btn-save:disabled { background: #a5d8b0; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0;">📊 Dashboard สรุปผลการลงทะเบียน EduPass</h2>
        <button class="logout-btn" onclick="logout()">ออกจากระบบ</button>
    </div>

    <div class="filter-section" id="adminFilter">
        <div>
            <b id="roleLabel">ระดับการเรียกดู: </b>
            <select id="amphoeSelect" onchange="renderTable()" style="display:none;">
                <option value="ทั้งหมด">ภาพรวมทั้งหมด (ทุกอำเภอ)</option>
                <option value="เมืองลำพูน">เมืองลำพูน</option>
                <option value="แม่ทา">แม่ทา</option>
                <option value="บ้านโฮ่ง">บ้านโฮ่ง</option>
                <option value="ลี้">ลี้</option>
                <option value="ทุ่งหัวช้าง">ทุ่งหัวช้าง</option>
                <option value="ป่าซาง">ป่าซาง</option>
                <option value="บ้านธิ">บ้านธิ</option>
                <option value="เวียงหนองล่อง">เวียงหนองล่อง</option>
            </select>
            <span id="areaLabel" style="font-size: 18px; font-weight: bold; color: #007bff; display:none;"></span>
        </div>
        <!-- ปุ่มเปิดตั้งค่า (เฉพาะระดับอำเภอ) -->
        <button id="btnOpenSetup" class="btn-setup" style="display:none;" onclick="toggleSetup()">⚙️ จัดสรรเป้าหมายรายตำบล</button>
    </div>

    <!-- ส่วนตั้งค่าเป้าหมายสำหรับแอดมินอำเภอ -->
    <div id="targetSetupBox">
        <h3 style="margin-top:0; color:#856404;">⚙️ จัดสรรยอดเป้าหมายรายตำบล</h3>
        <div class="setup-header" id="setupSummaryInfo"></div>
        <div id="targetInputs" class="target-grid"></div>
        <button id="saveTargetBtn" class="btn-save" onclick="saveTargets()" disabled>💾 บันทึกเป้าหมาย</button>
    </div>

    <!-- สรุปตัวเลขใหญ่ -->
    <div class="summary-box" id="summaryBox"></div>

    <!-- ตารางความคืบหน้าภาพรวม -->
    <div style="overflow-x:auto;">
        <h3>📌 ความคืบหน้าการลงทะเบียน</h3>
        <table>
            <thead>
                <tr>
                    <th id="progressHeaderCol" width="25%">พื้นที่</th>
                    <th width="20%">เป้าหมาย (คน)</th>
                    <th width="20%">รายงานแล้ว (คน)</th>
                    <th width="15%">ร้อยละ (%)</th>
                    <th width="20%">สถานะ</th>
                </tr>
            </thead>
            <tbody id="progressTable">
                <tr><td colspan="5" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // *** นำ Web App URL ของคุณมาใส่ตรงนี้ ***
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwWky03oDGIfJ6DCyo3M730k6B2dWrbqtVt0wzdQJrY4aS2cgsHz3ccBhmFOj8p68Krfw/exec'; 

    let allReports = [], allTargets = [], amphoeTargets = {};
    let userRole = localStorage.getItem("userRole"); 
    let userArea = localStorage.getItem("userAmphoe"); // จังหวัด=ทั้งหมด, อำเภอ=ชื่ออำเภอ, ตำบล=ชื่อตำบล

    const tambonData = {
        "เมืองลำพูน": ["ในเมือง", "เหมืองง่า", "อุโมงค์", "หนองช้างคืน", "ประตูป่า", "ริมปิง", "ต้นธง", "บ้านแป้น", "เหมืองจี้", "ป่าสัก", "เวียงยอง", "บ้านกลาง", "มะเขือแจ้", "ศรีบัวบาน", "หนองหนาม"],
        "แม่ทา": ["ทาปลาดุก", "ทาสบเส้า", "ทากาศ", "ทาขุมเงิน", "ทาทุ่งหลวง", "ทาแม่ลอบ"],
        "บ้านโฮ่ง": ["บ้านโฮ่ง", "ป่าพลู", "เหล่ายาว", "ศรีเตี้ย", "หนองปลาสะวาย"],
        "ลี้": ["ลี้", "แม่ตืน", "นาทราย", "ดงดำ", "ก้อ", "แม่ลาน", "ป่าไผ่", "ศรีวิชัย"],
        "ทุ่งหัวช้าง": ["ทุ่งหัวช้าง", "บ้านปวง", "ตะเคียนปม"],
        "ป่าซาง": ["ปากบ่อง", "ป่าซาง", "แม่แรง", "ม่วงน้อย", "บ้านเรือน", "มะกอก", "ท่าตุ้ม", "น้ำดิบ", "นครเจดีย์"],
        "บ้านธิ": ["บ้านธิ", "ห้วยยาบ"],
        "เวียงหนองล่อง": ["หนองล่อง", "หนองยวง", "วังผาง"]
    };

    // ฟังก์ชันช่วยหาว่าตำบลนี้อยู่อำเภออะไร
    function getAmphoeByTambon(tb) {
        for (let amp in tambonData) { if (tambonData[amp].includes(tb)) return amp; }
        return "";
    }

    if (!userRole) window.location.href = "login.html";

    window.onload = function() {
        if(userRole === "จังหวัด") {
            document.getElementById('amphoeSelect').style.display = "inline-block";
        } else {
            document.getElementById('areaLabel').style.display = "inline-block";
            let prefix = userRole === "อำเภอ" ? "สกร.อำเภอ " : "สกร.ตำบล ";
            document.getElementById('areaLabel').innerText = prefix + userArea;
            
            if(userRole === "อำเภอ") {
                document.getElementById('btnOpenSetup').style.display = "inline-block";
            }
        }

        fetch(scriptURL + "?action=getReport")
            .then(res => res.json())
            .then(data => {
                allReports = data.reports;
                allTargets = data.targets;
                amphoeTargets = data.amphoeTargets || {};
                renderTable();
            }).catch(error => { console.error(error); });
    };

    function renderTable() {
        let displayMode = "AMPHOE"; // AMPHOE, TAMBON, SINGLE_TAMBON
        let filterAmphoe = "";

        if (userRole === "จังหวัด") {
            let sel = document.getElementById('amphoeSelect').value;
            displayMode = (sel === "ทั้งหมด") ? "AMPHOE" : "TAMBON";
            filterAmphoe = sel;
        } else if (userRole === "อำเภอ") {
            displayMode = "TAMBON";
            filterAmphoe = userArea;
        } else if (userRole === "ตำบล") {
            displayMode = "SINGLE_TAMBON";
            filterAmphoe = getAmphoeByTambon(userArea);
        }

        let totalTarget = 0, totalActual = 0;
        let progressHTML = '';
        document.getElementById('progressHeaderCol').innerText = (displayMode === "AMPHOE") ? "อำเภอ" : "ตำบล";

        if (displayMode === "AMPHOE") {
            // โหมดภาพรวมจังหวัด (แสดงตารางเป็นอำเภอ)
            let ampStats = {};
            Object.keys(tambonData).forEach(a => ampStats[a] = {target: parseInt(amphoeTargets[a]) || 0, actual: 0});
            allReports.forEach(r => { if(ampStats[r.amphoe]) ampStats[r.amphoe].actual++; });
            
            for(let a in ampStats) {
                let d = ampStats[a];
                totalTarget += d.target;
                totalActual += d.actual;
                let p = d.target > 0 ? ((d.actual/d.target)*100).toFixed(2) : 0;
                let status = d.actual >= d.target && d.target > 0 ? "✅ ครบถ้วน" : "⏳ กำลังดำเนินการ";
                progressHTML += `<tr><td>อำเภอ${a}</td><td style="text-align:center;">${d.target}</td><td style="text-align:center; font-weight:bold;">${d.actual}</td><td style="text-align:center;">${p}%</td><td>${status}</td></tr>`;
            }
            document.getElementById('summaryBox').innerHTML = `ภาพรวมจังหวัดลำพูน ยอดรวมเป้าหมายทั้งสิ้น <span class="highlight">${totalTarget}</span> คน<br>รายงานแล้ว <span class="highlight">${totalActual}</span> คน คิดเป็นร้อยละ <span class="highlight">${totalTarget>0 ? ((totalActual/totalTarget)*100).toFixed(2) : 0}%</span>`;
        
        } else if (displayMode === "TAMBON") {
            // โหมดภาพรวมรายอำเภอ (แสดงตารางเป็นตำบล)
            let tbStats = {};
            tambonData[filterAmphoe].forEach(t => tbStats[t] = {target: 0, actual: 0});
            allTargets.forEach(t => { if(t.amphoe === filterAmphoe && tbStats[t.tambon]) tbStats[t.tambon].target = parseInt(t.target) || 0; });
            allReports.forEach(r => { if(r.amphoe === filterAmphoe && tbStats[r.tambon]) tbStats[r.tambon].actual++; });

            totalTarget = parseInt(amphoeTargets[filterAmphoe]) || 0; // ยึดเป้าหมายอำเภอที่จังหวัดตั้งให้เป็นหลัก
            
            for(let t in tbStats) {
                let d = tbStats[t];
                totalActual += d.actual;
                let p = d.target > 0 ? ((d.actual/d.target)*100).toFixed(2) : 0;
                let status = d.actual >= d.target && d.target > 0 ? "✅ ครบถ้วน" : "⏳ กำลังดำเนินการ";
                progressHTML += `<tr><td>ตำบล${t}</td><td style="text-align:center;">${d.target}</td><td style="text-align:center; font-weight:bold;">${d.actual}</td><td style="text-align:center;">${p}%</td><td>${status}</td></tr>`;
            }
            let pct = totalTarget>0 ? ((totalActual/totalTarget)*100).toFixed(2) : 0;
            document.getElementById('summaryBox').innerHTML = `อำเภอ${filterAmphoe} ยอดรวมเป้าหมายทั้งสิ้น <span class="highlight">${totalTarget}</span> คน<br>รายงานแล้ว <span class="highlight">${totalActual}</span> คน คิดเป็นร้อยละ <span class="highlight">${pct}%</span>`;
        
        } else if (displayMode === "SINGLE_TAMBON") {
            // โหมดสำหรับสกร.ตำบล
            let myTarget = allTargets.find(t => t.tambon === userArea);
            totalTarget = myTarget ? (parseInt(myTarget.target) || 0) : 0;
            let rep = allReports.filter(r => r.tambon === userArea);
            totalActual = rep.length;
            let pct = totalTarget > 0 ? ((totalActual/totalTarget)*100).toFixed(2) : 0;
            let status = totalActual >= totalTarget && totalTarget > 0 ? "✅ ครบถ้วน" : "⏳ กำลังดำเนินการ";

            progressHTML = `<tr><td>ตำบล${userArea}</td><td style="text-align:center;">${totalTarget}</td><td style="text-align:center; font-weight:bold;">${totalActual}</td><td style="text-align:center;">${pct}%</td><td>${status}</td></tr>`;
            document.getElementById('summaryBox').innerHTML = `ตำบล${userArea} ยอดรวมเป้าหมายทั้งสิ้น <span class="highlight">${totalTarget}</span> คน<br>รายงานแล้ว <span class="highlight">${totalActual}</span> คน คิดเป็นร้อยละ <span class="highlight">${pct}%</span>`;
        }

        document.getElementById('progressTable').innerHTML = progressHTML;
    }

    // --- ระบบจัดการเป้าหมายอำเภอ ---
    let maxAmphoeTarget = 0;

    function toggleSetup() {
        const box = document.getElementById('targetSetupBox');
        if (box.style.display === "block") {
            box.style.display = "none";
        } else {
            maxAmphoeTarget = parseInt(amphoeTargets[userArea]) || 0;
            const inputsDiv = document.getElementById('targetInputs');
            inputsDiv.innerHTML = '';
            
            tambonData[userArea].forEach(tb => {
                let old = allTargets.find(t => t.amphoe === userArea && t.tambon === tb);
                let val = old ? old.target : 0;
                inputsDiv.innerHTML += `<div class="target-item"><label>ต.${tb}</label><input type="number" id="tgt_${tb}" class="tgt-input" value="${val}" min="0" oninput="calculateSetupSum()"></div>`;
            });
            
            box.style.display = "block";
            calculateSetupSum();
        }
    }

    function calculateSetupSum() {
        let sum = 0;
        document.querySelectorAll('.tgt-input').forEach(input => {
            sum += parseInt(input.value) || 0;
        });

        let diff = maxAmphoeTarget - sum;
        let diffHTML = diff === 0 ? `<span style="color:green;">จัดสรรครบพอดี ✅</span>` : 
                       diff > 0 ? `<span style="color:red;">ยังขาดอีก ${diff} คน</span>` : 
                       `<span style="color:red;">จัดสรรเกินเป้าหมาย ${Math.abs(diff)} คน</span>`;

        document.getElementById('setupSummaryInfo').innerHTML = `
            <b>เป้าหมายรวมที่จังหวัดกำหนด: <span style="font-size:18px;">${maxAmphoeTarget}</span> คน</b><br>
            รวมตัวเลขที่ท่านกรอก: <b>${sum}</b> คน (${diffHTML})
        `;

        // บังคับให้ผลรวมเท่ากับเป้าหมายที่จังหวัดตั้งไว้ ถึงจะกดเซฟได้
        const btn = document.getElementById('saveTargetBtn');
        if (sum === maxAmphoeTarget && maxAmphoeTarget > 0) {
            btn.disabled = false;
        } else {
            btn.disabled = true;
        }
    }

    function saveTargets() {
        let payload = [];
        tambonData[userArea].forEach(tb => {
            let val = document.getElementById('tgt_' + tb).value;
            payload.push({ amphoe: userArea, tambon: tb, target: parseInt(val) || 0 });
        });

        Swal.fire({ title: 'กำลังบันทึกเป้าหมาย...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        fetch(scriptURL, { method: 'POST', body: JSON.stringify({ action: 'saveTargets', targets: payload }) })
        .then(res => res.json()).then(data => {
            Swal.fire('สำเร็จ', 'บันทึกเป้าหมายเรียบร้อยแล้ว', 'success').then(() => window.location.reload());
        }).catch(err => Swal.fire('ผิดพลาด', 'ไม่สามารถบันทึกได้', 'error'));
    }

    function logout() { localStorage.clear(); window.location.href = "login.html"; }
</script>
</body>
</html>
