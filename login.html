<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - รายงานผล EduPass</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #34495e; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #2c3e50; }
    </style>
</head>
<body>

<div class="login-box">
    <h3>🔒 เข้าสู่ระบบรายงานผล</h3>
    <form id="loginForm">
        <input type="text" id="username" placeholder="ชื่อผู้ใช้งาน (Username)" required>
        <input type="password" id="password" placeholder="รหัสผ่าน (Password)" required>
        <button type="submit" id="loginBtn">เข้าสู่ระบบ</button>
    </form>
    <a href="index.html" style="display:block; margin-top:15px; color:#007bff; text-decoration:none; font-size:14px;">กลับหน้าแรก</a>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycby463fiOLQRwsOzfxXTJ31GHLUeLSV5BGeKXpsSAwSDSL59msesH17Mae-N14H-yhluaQ/exec'; // *** เปลี่ยนด้วย ***

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        btn.innerText = 'กำลังตรวจสอบ...';
        btn.disabled = true;

        const payload = {
            action: "login",
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        // สำหรับ login เราไม่ใช้ no-cors เพราะต้องรับข้อความยืนยันจาก Google
        fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) })
        .then(response => response.json())
        .then(data => {
            if(data.status === "success") {
                // เก็บข้อมูลสิทธิ์ไว้ในเครื่อง
                localStorage.setItem("userRole", data.role);
                localStorage.setItem("userAmphoe", data.amphoe);
                
                Swal.fire({ icon: 'success', title: 'ยินดีต้อนรับ', showConfirmButton: false, timer: 1500 })
                .then(() => { window.location.href = "dashboard.html"; });
            } else {
                Swal.fire({ icon: 'error', title: 'รหัสผ่านไม่ถูกต้อง!' });
                btn.innerText = 'เข้าสู่ระบบ';
                btn.disabled = false;
            }
        })
        .catch(error => {
            Swal.fire({ icon: 'error', title: 'เชื่อมต่อล้มเหลว' });
            btn.innerText = 'เข้าสู่ระบบ';
            btn.disabled = false;
        });
    });
</script>
</body>
</html>
