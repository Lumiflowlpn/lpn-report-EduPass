<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - รายงานผลการลงทะเบียนการเข้าใช้งานแอปพลิเคชัน EduPass</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: #f0f4f8; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        .login-box { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        h3 { color: #1e293b; margin-top: 0; line-height: 1.4;}
        
        /* สไตล์ปุ่มเมนู 2 ทางเลือก */
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Sarabun', sans-serif;
            text-decoration: none;
            margin-top: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        .btn-report {
            background-color: #f8fafc;
            color: #0284c7;
            border: 2px solid #0284c7;
        }
        .btn-report:hover {
            background-color: #0284c7;
            color: white;
            transform: translateY(-2px);
        }

        .btn-admin {
            background-color: #34495e;
            color: white;
            border: 2px solid #34495e;
        }
        .btn-admin:hover {
            background-color: #2c3e50;
            border-color: #2c3e50;
            transform: translateY(-2px);
        }

        /* ฟอร์มล็อกอิน (ซ่อนไว้ก่อน) */
        #loginFormContainer {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px dashed #cbd5e1;
        }
        
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #ced4da; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-family: 'Sarabun', sans-serif;
        }
        .btn-submit { 
            width: 100%; 
            padding: 12px; 
            background-color: #10b981; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 10px; 
            font-family: 'Sarabun', sans-serif;
        }
        .btn-submit:hover { background-color: #059669; }
        
        .back-link {
            display: inline-block; 
            margin-top: 20px; 
            color: #64748b; 
            text-decoration: none; 
            font-size: 14px;
            transition: 0.3s;
        }
        .back-link:hover { color: #1e293b; text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-box">
    <h3>ระบบรายงานผลการลงทะเบียน EduPass<br><small style="color:#64748b; font-size: 15px;">สกร.ลำพูน</small></h3>
    
    <!-- เมนูให้เลือก (Landing Page) -->
    <div id="menuSelection">
        <a href="report.html" class="menu-btn btn-report">
            <span style="font-size: 20px;">📊</span> ดูรายงานผล (อินโฟกราฟิก)
        </a>
        <button class="menu-btn btn-admin" onclick="showLoginForm()">
            <span style="font-size: 20px;">🔒</span> เข้าสู่ระบบ (สำหรับแอดมิน)
        </button>
    </div>

    <!-- ฟอร์มเข้าสู่ระบบ (ถูกซ่อนไว้ตอนแรก) -->
    <div id="loginFormContainer">
        <h4 style="margin-top:0; color:#34495e;">เข้าสู่ระบบจัดการข้อมูลรายบุคคล</h4>
        <form id="loginForm">
            <input type="text" id="username" placeholder="ผู้ใช้งาน (Username)" required>
            <input type="password" id="password" placeholder="รหัสผ่าน (Password)" required>
            <button type="submit" id="loginBtn" class="btn-submit">เข้าสู่ระบบ</button>
        </form>
        <button class="back-link" style="background:none; border:none; cursor:pointer;" onclick="hideLoginForm()">🔙 ยกเลิก / กลับไปเลือกเมนู</button>
    </div>
    
    <div style="margin-top:20px;">
        <a href="index.html" class="back-link">🏠 กลับหน้าลงทะเบียน (สำหรับผู้เรียน)</a>
    </div>
</div>

<script>
    // ฟังก์ชันสำหรับเปิดหน้าฟอร์มล็อกอิน
    function showLoginForm() {
        document.getElementById('menuSelection').style.display = 'none';
        document.getElementById('loginFormContainer').style.display = 'block';
    }

    // ฟังก์ชันสำหรับย้อนกลับไปหน้าเลือกเมนู
    function hideLoginForm() {
        document.getElementById('loginFormContainer').style.display = 'none';
        document.getElementById('menuSelection').style.display = 'block';
        document.getElementById('loginForm').reset(); // เคลียร์ช่องพิมพ์
    }

    const scriptURL = 'https://script.google.com/macros/s/AKfycbzz5Z2cIVThEYu3DwG868kdjL3VSWSobn6QsQbjwlIALwD_O48XmEOx_LKxzpHzNQTOuw/exec'; // *** เปลี่ยนด้วย ***

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        btn.innerText = 'กำลังตรวจสอบ...';
        btn.disabled = true;

        const payload = {
            action: "login",
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) })
        .then(response => response.json())
        .then(data => {
            if(data.status === "success") {
                // เก็บข้อมูลสิทธิ์ไว้ในเครื่อง
                localStorage.setItem("userRole", data.role);
                localStorage.setItem("userAmphoe", data.amphoe);
                
                Swal.fire({ icon: 'success', title: 'ยินดีต้อนรับ', showConfirmButton: false, timer: 1500 })
                .then(() => { window.location.href = "dashboard.html"; });
            } else {
                Swal.fire({ icon: 'error', title: 'รหัสผ่านไม่ถูกต้อง!' });
                btn.innerText = 'เข้าสู่ระบบ';
                btn.disabled = false;
            }
        })
        .catch(error => {
            Swal.fire({ icon: 'error', title: 'เชื่อมต่อล้มเหลว' });
            btn.innerText = 'เข้าสู่ระบบ';
            btn.disabled = false;
        });
    });
</script>
</body>
</html>
